<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars Pro Clone</title>
    <style>
        :root {
            --gem-color: #00ffcc;
            --coin-color: #ffd700;
            --hp-color: #2ecc71;
            --super-color: #f1c40f;
        }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; touch-action: none; }
        canvas { display: none; background: #3d7a3d; }

        /* --- LOBBY DESIGN --- */
        #lobby {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://wallpaperaccess.com/full/1385310.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }

        /* Top Bar (Gems & Coins) */
        .top-bar {
            position: absolute; top: 20px; right: 20px; display: flex; gap: 15px;
        }
        .currency {
            background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 20px;
            color: white; border: 2px solid #555; display: flex; align-items: center; gap: 8px;
        }

        /* Character & Box */
        .character-area { position: relative; display: flex; flex-direction: column; align-items: center; }
        .hero { width: 120px; height: 200px; background: #3498db; border-radius: 40px; box-shadow: 0 0 30px #3498db; animation: float 2s infinite ease-in-out; }
        .box { 
            width: 80px; height: 60px; background: #e74c3c; border: 4px solid #fff; 
            margin-top: 20px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 10px 0 #c0392b; transition: 0.1s;
        }
        .box:active { transform: translateY(5px); box-shadow: 0 5px 0 #c0392b; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .btn-play {
            margin-top: 40px; padding: 15px 60px; font-size: 28px;
            background: linear-gradient(#f1c40f, #f39c12); color: white;
            border: 4px solid #fff; border-radius: 15px; cursor: pointer;
            text-shadow: 2px 2px #000; box-shadow: 0 8px 0 #d35400;
        }

        /* --- IN-GAME UI --- */
        #game-ui {
            position: absolute; top: 20px; left: 20px; display: none; color: white;
        }
        .joy-container {
            position: absolute; bottom: 40px; width: 100%; display: none;
            justify-content: space-around; pointer-events: none;
        }
        .joystick {
            width: 120px; height: 120px; background: rgba(255,255,255,0.2);
            border-radius: 50%; border: 3px solid rgba(255,255,255,0.4); pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby">
        <div class="top-bar">
            <div class="currency" style="border-color: var(--gem-color)">💎 <span id="gem-count">0</span></div>
            <div class="currency" style="border-color: var(--coin-color)">🟡 <span id="coin-count">0</span></div>
        </div>

        <div class="character-area">
            <div class="hero"></div>
            <div class="box" onclick="alert('Box Opening... Get Coins!')"></div>
            <p style="color: white;">Brawl Box</p>
        </div>

        <button class="btn-play" onclick="initGame()">BRAWL!</button>
    </div>

    <!-- GAME UI -->
    <div id="game-ui">
        <div class="currency">💎 <span id="game-gems">0</span></div>
        <div style="width: 200px; height: 15px; background: #333; margin-top: 10px; border-radius: 10px; overflow: hidden;">
            <div id="hp-bar" style="width: 100%; height: 100%; background: var(--hp-color);"></div>
        </div>
    </div>

    <!-- JOYSTICKS -->
    <div class="joy-container" id="controls">
        <div class="joystick" id="move-joy"></div>
        <div class="joystick" id="attack-joy" style="border-color: #e74c3c; background: rgba(231, 76, 60, 0.2);"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let state = 'LOBBY';
    let player = { x: 0, y: 0, hp: 100, gems: 0, coins: 0 };
    let bullets = [], enemies = [], items = [];
    let joyMove = { x: 0, y: 0 }, joyAtk = { x: 0, y: 0 };

    function initGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        document.getElementById('controls').style.display = 'flex';
        canvas.style.display = 'block';
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        
        state = 'PLAYING';
        gameLoop();
    }

    // --- BOSHQUV VA ATTACK ---
    window.addEventListener('touchstart', (e) => {
        let touch = e.touches[0];
        if(touch.clientX > canvas.width/2) {
            shoot(touch.clientX, touch.clientY); // O'ng taraf bosilganda hujum
        }
    });

    function shoot(tx, ty) {
        let angle = Math.atan2(ty - player.y, tx - player.x);
        bullets.push({ 
            x: player.x, y: player.y, 
            vx: Math.cos(angle) * 12, vy: Math.sin(angle) * 12 
        });
    }

    function spawnEnemy() {
        if(enemies.length < 5) {
            enemies.push({ x: Math.random()*canvas.width, y: -50, hp: 3 });
        }
    }

    function gameLoop() {
        if(state !== 'PLAYING') return;

        // Background (Jang maydoni)
        ctx.fillStyle = '#4caf50'; // Yashil o'tloq
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Panjara chizish
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }

        // Player (Hero)
        ctx.fillStyle = '#3498db';
        ctx.beginPath(); ctx.arc(player.x, player.y, 25, 0, Math.PI*2); ctx.fill();

        // O'qlar (Attack)
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = 'yellow';
            ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
            if(b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
        });

        // Dushmanlar va Kristalllar
        enemies.forEach((en, ei) => {
            let dx = player.x - en.x, dy = player.y - en.y;
            let dist = Math.sqrt(dx*dx+dy*dy);
            en.x += dx/dist * 2; en.y += dy/dist * 2;

            ctx.fillStyle = '#e74c3c';
            ctx.beginPath(); ctx.arc(en.x, en.y, 20, 0, Math.PI*2); ctx.fill();

            // O'q tegishi
            bullets.forEach((b, bi) => {
                let d = Math.sqrt((en.x-b.x)**2 + (en.y-b.y)**2);
                if(d < 25) {
                    enemies.splice(ei, 1);
                    bullets.splice(bi, 1);
                    // Kristall tushishi (Gem drop)
                    items.push({ x: en.x, y: en.y, type: 'GEM' });
                }
            });
        });

        // Kristallarni yig'ish
        items.forEach((it, ii) => {
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(it.x, it.y, 15, 15);
            let d = Math.sqrt((player.x-it.x)**2 + (player.y-it.y)**2);
            if(d < 30) {
                items.splice(ii, 1);
                player.gems++;
                document.getElementById('game-gems').innerText = player.gems;
                document.getElementById('gem-count').innerText = player.gems;
            }
        });

        if(Math.random() < 0.02) spawnEnemy();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
