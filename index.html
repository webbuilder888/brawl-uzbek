<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars 2D Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Arial Black', sans-serif; touch-action: none; }
        canvas { display: block; background: #3d7a3d; background-image: radial-gradient(#4caf50 1px, transparent 1px); background-size: 40px 40px; }
        
        /* UI Elementlari */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .stat-bar { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; border: 2px solid #fff; min-width: 150px; }
        .hp-container { width: 100%; height: 20px; background: #333; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        #hp-fill { width: 100%; height: 100%; background: #2ecc71; transition: width 0.3s; }
        
        .super-container { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        #super-fill { width: 0%; height: 100%; background: #f1c40f; transition: width 0.3s; }
        
        #score-text { color: white; font-size: 18px; text-transform: uppercase; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 40px; border-radius: 20px; text-align: center; color: white; display: none; pointer-events: auto; }
        
        /* Tugmalar */
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; }
        .btn { width: 85px; height: 85px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: bold; pointer-events: auto; cursor: pointer; user-select: none; border: 5px solid rgba(255,255,255,0.5); }
        #attack-btn { background: radial-gradient(#e74c3c, #c0392b); }
        #super-btn { background: radial-gradient(#f1c40f, #f39c12); opacity: 0.3; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="stat-bar">
            <div id="score-text">KILLS: 0</div>
            <div class="hp-container"><div id="hp-fill"></div></div>
            <div class="super-container"><div id="super-fill"></div></div>
        </div>

        <div class="controls">
            <div class="btn" id="move-area" style="background: rgba(255,255,255,0.1);">STICK</div>
            <div style="display: flex; gap: 20px;">
                <div class="btn" id="super-btn" onclick="activateSuper()">SUPER</div>
                <div class="btn" id="attack-btn" onpointerdown="startFire()" onpointerup="stopFire()">FIRE</div>
            </div>
        </div>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p id="final-score"></p>
        <button onclick="location.reload()" style="padding: 10px 20px; cursor: pointer; font-weight: bold;">TRY AGAIN</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // O'yin o'zgaruvchilari
    let score = 0;
    let isGameOver = false;
    let isFiring = false;
    let superLevel = 0;
    let isSuperActive = false;

    let player = {
        x: canvas.width/2,
        y: canvas.height/2,
        size: 25,
        hp: 100,
        maxHp: 100,
        speed: 4
    };

    let bullets = [];
    let enemies = [];
    let particles = [];

    // Boshqaruv (Sichqoncha yoki Touch)
    let mouse = { x: player.x, y: player.y };
    window.addEventListener('pointermove', (e) => {
        if (!isGameOver) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }
    });

    function startFire() { isFiring = true; }
    function stopFire() { isFiring = false; }

    function activateSuper() {
        if (superLevel >= 100) {
            isSuperActive = true;
            superLevel = 0;
            document.getElementById('super-fill').style.width = '0%';
            document.getElementById('super-btn').style.opacity = '0.3';
            setTimeout(() => { isSuperActive = false; }, 5000);
        }
    }

    // Effketlar (Portlash)
    function createExplosion(x, y, color) {
        for(let i=0; i<8; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random()-0.5)*10,
                vy: (Math.random()-0.5)*10,
                life: 20,
                color: color
            });
        }
    }

    function spawnEnemy() {
        if (isGameOver) return;
        let side = Math.floor(Math.random()*4);
        let x, y;
        if(side==0) { x=Math.random()*canvas.width; y=-50; }
        else if(side==1) { x=canvas.width+50; y=Math.random()*canvas.height; }
        else if(side==2) { x=Math.random()*canvas.width; y=canvas.height+50; }
        else { x=-50; y=Math.random()*canvas.height; }
        
        enemies.push({ x: x, y: y, hp: 3, speed: 1.5 + (score/10), size: 20 });
    }

    function update() {
        if (isGameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // O'yinchini harakati (Sichqoncha tomon yurish)
        let dx = mouse.x - player.x;
        let dy = mouse.y - player.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 5) {
            player.x += (dx/dist) * player.speed;
            player.y += (dy/dist) * player.speed;
        }

        // O'yinchini chizish
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = isSuperActive ? "#f1c40f" : "#3b82f6";
        ctx.fillStyle = isSuperActive ? "#f1c40f" : "#3b82f6";
        ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        // O'q otish
        if (isFiring && frames % 10 == 0) {
            let angle = Math.atan2(dy, dx);
            let bulletCount = isSuperActive ? 5 : 1;
            for(let i=0; i<bulletCount; i++) {
                let spread = isSuperActive ? (Math.random()-0.5) : 0;
                bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(angle + spread) * 10,
                    vy: Math.sin(angle + spread) * 10,
                    power: isSuperActive ? 2 : 1
                });
            }
        }

        // O'qlar harakati
        bullets.forEach((b, index) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
            if(b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) bullets.splice(index, 1);
        });

        // Dushmanlar harakati
        enemies.forEach((en, eIdx) => {
            let edx = player.x - en.x;
            let edy = player.y - en.y;
            let edist = Math.sqrt(edx*edx + edy*edy);
            en.x += (edx/edist) * en.speed;
            en.y += (edy/edist) * en.speed;

            // Dushman ko'rinishi
            ctx.fillStyle = "#e74c3c";
            ctx.beginPath(); ctx.arc(en.x, en.y, en.size, 0, Math.PI*2); ctx.fill();

            // To'qnashuv: Dushman o'yinchiga tegsa
            if(edist < player.size + en.size) {
                player.hp -= 0.5;
                document.getElementById('hp-fill').style.width = player.hp + "%";
                if(player.hp <= 0) endGame();
            }

            // O'q dushmanga tegsa
            bullets.forEach((b, bIdx) => {
                let hitDist = Math.sqrt((en.x - b.x)**2 + (en.y - b.y)**2);
                if(hitDist < en.size) {
                    en.hp -= b.power;
                    bullets.splice(bIdx, 1);
                    if(en.hp <= 0) {
                        createExplosion(en.x, en.y, "#e74c3c");
                        enemies.splice(eIdx, 1);
                        score++;
                        superLevel = Math.min(100, superLevel + 5);
                        document.getElementById('score-text').innerText = "KILLS: " + score;
                        document.getElementById('super-fill').style.width = superLevel + "%";
                        if(superLevel >= 100) document.getElementById('super-btn').style.opacity = '1';
                    }
                }
            });
        });

        // Zarralar (Particles)
        particles.forEach((p, index) => {
            p.x += p.vx; p.y += p.vy; p.life--;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life/20;
            ctx.fillRect(p.x, p.y, 4, 4);
            if(p.life <= 0) particles.splice(index, 1);
        });
        ctx.globalAlpha = 1;

        frames++;
        requestAnimationFrame(update);
    }

    function endGame() {
        isGameOver = true;
        document.getElementById('game-over').style.display = 'block';
        document.getElementById('final-score').innerText = "You defeated " + score + " brawlers!";
    }

    let frames = 0;
    setInterval(spawnEnemy, 1500);
    update();
</script>
</body>
</html>
