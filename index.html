<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Brawl Ultra Pro</title>
    <style>
        :root { --gold: #ffd700; --gem: #ae00ff; --blue: #3498db; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; touch-action: none; -webkit-user-select: none; }
        
        /* LOBBY UI */
        #lobby { 
            position: absolute; width: 100%; height: 100%; 
            background: radial-gradient(circle, #2c3e50, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        
        .top-bar { position: absolute; top: 15px; right: 20px; display: flex; gap: 15px; }
        .res { background: rgba(0,0,0,0.8); padding: 8px 25px; border-radius: 25px; border: 2px solid #fff; color: white; font-size: 18px; }

        .character-view { width: 200px; height: 250px; position: relative; margin-bottom: 20px; transition: 0.3s; }
        .character-view img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 20px var(--blue)); }

        .btn-menu { display: flex; gap: 15px; }
        .btn { padding: 15px 40px; border-radius: 40px; border: none; cursor: pointer; font-weight: bold; font-size: 20px; text-transform: uppercase; box-shadow: 0 6px #000; }
        .play { background: #ffcc00; color: #000; }
        .shop { background: #e74c3c; color: #fff; }
        .promo { background: #2ecc71; color: #fff; font-size: 14px; }

        /* SHOP OVERLAY */
        #shop-ui, #promo-ui { 
            position: absolute; width: 80%; height: 70%; background: rgba(0,0,0,0.9); 
            border: 4px solid #fff; border-radius: 20px; display: none; z-index: 110; color: white; padding: 20px; text-align: center;
        }
        .shop-items { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
        .item { background: #34495e; padding: 15px; border-radius: 15px; width: 150px; }

        /* JOYSTICKS */
        .joy { position: absolute; bottom: 40px; width: 110px; height: 110px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 3px solid #fff; display: none; z-index: 50; }
        .handle { position: absolute; width: 45px; height: 45px; background: #fff; border-radius: 50%; left: 30px; top: 30px; }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- LOBBY SECTION -->
    <div id="lobby">
        <div class="top-bar">
            <div class="res" style="color: var(--gold);">🪙 <span id="m-gold">0</span></div>
            <div class="res" style="color: var(--gem);">💎 <span id="m-gem">0</span></div>
        </div>

        <div class="character-view" id="char-preview">
            <!-- Rasm yuklanmasa ham bo'sh qolmaydi -->
            <img id="p-img" src="https://vignette.wikia.nocookie.net/brawlstars/images/e/e0/Shelly_Portrait.png" alt="Brawler">
        </div>

        <h2 id="char-name" style="color: white; margin-top: 0;">SHELLY</h2>

        <div class="btn-menu">
            <button class="btn shop" onclick="toggleUI('shop-ui')">SHOP</button>
            <button class="btn play" onclick="startGame()">BATTLE</button>
            <button class="btn promo" onclick="toggleUI('promo-ui')">PROMO</button>
        </div>
    </div>

    <!-- SHOP -->
    <div id="shop-ui">
        <h1>BRAWLER SHOP</h1>
        <div class="shop-items">
            <div class="item">
                <h3>COLT</h3>
                <p>💎 50</p>
                <button onclick="buy('colt', 50)">BUY</button>
            </div>
            <div class="item">
                <h3>MORTIS</h3>
                <p>💎 150</p>
                <button onclick="buy('mortis', 150)">BUY</button>
            </div>
        </div>
        <br><button onclick="toggleUI('shop-ui')">CLOSE</button>
    </div>

    <!-- PROMO -->
    <div id="promo-ui">
        <h1>PROMO CODE</h1>
        <input type="text" id="promo-input" placeholder="Yozing..." style="padding: 10px; font-size: 20px;">
        <button onclick="checkPromo()">ACTIVATE</button>
        <p id="promo-msg"></p>
        <br><button onclick="toggleUI('promo-ui')">CLOSE</button>
    </div>

    <div id="m-joy" class="joy" style="left: 50px;"><div class="handle"></div></div>
    <div id="a-joy" class="joy" style="right: 50px;"><div class="handle"></div></div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // DATA TIZIMI
    let data = {
        gold: localStorage.getItem('gold') ? parseInt(localStorage.getItem('gold')) : 100,
        gem: localStorage.getItem('gem') ? parseInt(localStorage.getItem('gem')) : 20,
        unlocked: JSON.parse(localStorage.getItem('unlocked')) || ['shelly'],
        current: 'shelly'
    };

    const brawlers = {
        shelly: { name: 'SHELLY', color: '#9b59b6', speed: 5, img: 'https://vignette.wikia.nocookie.net/brawlstars/images/e/e0/Shelly_Portrait.png' },
        colt: { name: 'COLT', color: '#e67e22', speed: 7, img: 'https://vignette.wikia.nocookie.net/brawlstars/images/5/54/Colt_Portrait.png' },
        mortis: { name: 'MORTIS', color: '#34495e', speed: 9, img: 'https://vignette.wikia.nocookie.net/brawlstars/images/e/eb/Mortis_Portrait.png' }
    };

    function updateUI() {
        document.getElementById('m-gold').innerText = data.gold;
        document.getElementById('m-gem').innerText = data.gem;
        document.getElementById('p-img').src = brawlers[data.current].img;
        document.getElementById('char-name').innerText = brawlers[data.current].name;
        localStorage.setItem('gold', data.gold);
        localStorage.setItem('gem', data.gem);
        localStorage.setItem('unlocked', JSON.stringify(data.unlocked));
    }
    updateUI();

    function toggleUI(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function buy(id, price) {
        if (data.unlocked.includes(id)) { data.current = id; alert(id + " tanlandi!"); }
        else if (data.gem >= price) {
            data.gem -= price;
            data.unlocked.push(id);
            data.current = id;
            alert("Yangi brawler: " + id);
        } else alert("Kristallar yetarli emas!");
        updateUI();
    }

    function checkPromo() {
        const val = document.getElementById('promo-input').value.toLowerCase();
        if (val === 'gem' || val === 'brawl') {
            data.gem += 100;
            document.getElementById('promo-msg').innerText = "+100 💎 berildi!";
            updateUI();
        } else {
            document.getElementById('promo-msg').innerText = "Xato kod!";
        }
    }

    // GAME LOGIC
    let isRunning = false;
    let player = { x: 0, y: 0, hp: 100 };
    let joys = { move: {x:0, y:0, active: false}, aim: {x:0, y:0, active: false} };
    let bullets = [], enemies = [];

    function setupJoy(id, type) {
        const el = document.getElementById(id);
        const handle = el.querySelector('.handle');
        const cx = el.offsetLeft + 55, cy = el.offsetTop + 55;

        el.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            const move = (me) => {
                const mt = me.touches[0];
                let dx = mt.clientX - cx, dy = mt.clientY - cy;
                let d = Math.min(Math.sqrt(dx*dx+dy*dy), 40);
                let a = Math.atan2(dy, dx);
                joys[type].x = (Math.cos(a)*d)/40;
                joys[type].y = (Math.sin(a)*d)/40;
                handle.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
                joys[type].active = d > 5;
            };
            const stop = () => {
                joys[type].active = false; joys[type].x = 0; joys[type].y = 0;
                handle.style.transform = `translate(0,0)`;
                document.removeEventListener('touchmove', move);
                document.removeEventListener('touchend', stop);
            };
            document.addEventListener('touchmove', move);
            document.addEventListener('touchend', stop);
        });
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.querySelectorAll('.joy').forEach(j => j.style.display = 'block');
        canvas.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        player.x = canvas.width/2; player.y = canvas.height/2;
        setupJoy('m-joy', 'move'); setupJoy('a-joy', 'aim');
        isRunning = true; loop();
    }

    function loop() {
        if(!isRunning) return;
        ctx.fillStyle = '#1e3700'; ctx.fillRect(0,0,canvas.width,canvas.height); // Grass

        // Player
        player.x += joys.move.x * brawlers[data.current].speed;
        player.y += joys.move.y * brawlers[data.current].speed;
        ctx.fillStyle = brawlers[data.current].color;
        ctx.beginPath(); ctx.arc(player.x, player.y, 25, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.fillText(data.current.toUpperCase(), player.x-20, player.y-35);

        // Shoot
        if (joys.aim.active && Math.random() < 0.1) {
            bullets.push({x: player.x, y: player.y, vx: joys.aim.x*15, vy: joys.aim.y*15});
        }

        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = 'yellow'; ctx.fillRect(b.x, b.y, 8, 8);
            if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
        });

        // Enemies
        if (Math.random() < 0.02) enemies.push({x: Math.random()*canvas.width, y: -20, hp: 3});
        enemies.forEach((e, i) => {
            let dx = player.x-e.x, dy = player.y-e.y, d = Math.sqrt(dx*dx+dy*dy);
            e.x += (dx/d)*2; e.y += (dy/d)*2;
            ctx.fillStyle = 'red'; ctx.fillRect(e.x-20, e.y-20, 40, 40);
            
            bullets.forEach((b, bi) => {
                if (Math.hypot(b.x-e.x, b.y-e.y) < 30) {
                    e.hp--; bullets.splice(bi,1);
                    if(e.hp <= 0) { enemies.splice(i,1); data.gold += 10; updateUI(); }
                }
            });
            if(d < 30) player.hp -= 0.5;
        });

        // UI
        ctx.fillStyle = 'lime'; ctx.fillRect(player.x-25, player.y-50, player.hp/2, 5);
        if(player.hp <= 0) { isRunning = false; alert("GAME OVER!"); location.reload(); }

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
