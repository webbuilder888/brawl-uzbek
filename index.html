<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Brawl Stars Ultra Pro</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #ff007b;
            --accent: #ffcc00;
            --lobby-bg: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial Black', sans-serif;
            touch-action: none;
        }

        /* Landscape ogohlantirish */
        @media screen and (orientation: portrait) {
            #rotate-message { display: flex; }
        }
        #rotate-message {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: white; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center;
        }

        /* LOBBY DIZAYNI */
        #lobby {
            position: absolute; width: 100%; height: 100%;
            background: var(--lobby-bg);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; z-index: 100;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .character-stand {
            position: relative; width: 300px; height: 400px;
            display: flex; justify-content: center; align-items: flex-end;
            margin-top: 50px;
        }

        /* Personaj "Shelly" uslubida */
        .character {
            width: 120px; height: 250px;
            background: var(--primary);
            border-radius: 60px 60px 20px 20px;
            box-shadow: 0 0 50px var(--primary);
            position: relative; animation: idle 2s ease-in-out infinite;
        }

        @keyframes idle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .shadow {
            position: absolute; bottom: -20px; width: 150px; height: 30px;
            background: rgba(0,0,0,0.4); border-radius: 50%; filter: blur(10px);
        }

        .play-btn {
            background: linear-gradient(#ffcc00, #ff9900);
            border: 4px solid #fff; padding: 20px 80px;
            border-radius: 20px; color: #000; font-size: 32px;
            cursor: pointer; margin-bottom: 50px;
            box-shadow: 0 10px 0 #cc7a00, 0 20px 30px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .play-btn:active { transform: translateY(10px); box-shadow: 0 0 0 #cc7a00; }

        /* O'YIN MAYDONI */
        canvas { display: none; background: #2d5a27; }

        #ui {
            position: absolute; top: 20px; left: 20px; display: none;
            z-index: 50; color: white;
        }
    </style>
</head>
<body>

    <!-- Telefonni aylantirish haqida xabar -->
    <div id="rotate-message">
        <div style="font-size: 50px;">🔄</div>
        <h2>Iltimos, ekranni yonboshiga (Landscape) aylantiring!</h2>
    </div>

    <!-- LOBBY -->
    <div id="lobby">
        <div style="color: white; font-size: 48px; margin-top: 30px; text-shadow: 4px 4px #000;">BRAWL ULTRA</div>
        
        <div class="character-stand">
            <div class="shadow"></div>
            <div class="character">
                <div style="position:absolute; top:40px; left:25px; width:20px; height:20px; background:white; border-radius:50%;"></div>
                <div style="position:absolute; top:40px; right:25px; width:20px; height:20px; background:white; border-radius:50%;"></div>
            </div>
        </div>

        <button class="play-btn" onclick="startGame()">PLAY</button>
    </div>

    <!-- O'YIN INTERFEYSI -->
    <div id="ui">
        <div style="background:rgba(0,0,0,0.6); padding:15px; border-radius:15px; border:2px solid var(--primary);">
            <div id="frag-count">KILLS: 0</div>
            <div style="width:200px; height:15px; background:#333; margin-top:10px; border-radius:10px; overflow:hidden;">
                <div id="hp-bar" style="width:100%; height:100%; background: #00ff88; box-shadow: 0 0 15px #00ff88;"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const lobby = document.getElementById('lobby');
    const ui = document.getElementById('ui');

    let isGameRunning = false;
    let score = 0;
    let player = { x: 0, y: 0, size: 30, hp: 100 };
    let enemies = [], bullets = [], particles = [];

    function startGame() {
        lobby.style.display = 'none';
        canvas.style.display = 'block';
        ui.style.display = 'block';
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        
        isGameRunning = true;
        animate();
    }

    // --- BOSHQRUV (Virtual Joystick) ---
    let joyMove = { x: 0, y: 0, active: false };
    window.addEventListener('pointerdown', (e) => { joyMove.active = true; });
    window.addEventListener('pointermove', (e) => {
        if(joyMove.active) {
            player.x = e.clientX;
            player.y = e.clientY;
            // Otish avtomatik yoki bosganda (Brawl uslubi)
            if(frames % 10 === 0) fireBullet(e.clientX, e.clientY);
        }
    });
    window.addEventListener('pointerup', () => { joyMove.active = false; });

    function fireBullet(tx, ty) {
        let angle = Math.atan2(ty - player.y, tx - player.x);
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15 });
    }

    let frames = 0;
    function animate() {
        if(!isGameRunning) return;
        frames++;
        
        // Grafika: Arena Rendering
        ctx.fillStyle = '#1e3d1a'; // To'q yashil arena
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Panjara foni (3D effekt uchun)
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        for(let i=0; i<canvas.width; i+=60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

        // Player Drawing (Glow Effect)
        ctx.shadowBlur = 30; ctx.shadowColor = '#00f2ff';
        ctx.fillStyle = '#00f2ff';
        ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // Dushmanlar (Enemies)
        if(frames % 50 === 0) {
            enemies.push({ x: Math.random() * canvas.width, y: -50, hp: 2 });
        }

        enemies.forEach((en, index) => {
            let dx = player.x - en.x;
            let dy = player.y - en.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            en.x += (dx/dist) * 2.5; en.y += (dy/dist) * 2.5;

            ctx.fillStyle = '#ff007b';
            ctx.beginPath(); ctx.arc(en.x, en.y, 25, 0, Math.PI*2); ctx.fill();
            
            // Player bilan to'qnashuv
            if(dist < 55) {
                player.hp -= 0.2;
                document.getElementById('hp-bar').style.width = player.hp + "%";
            }
        });

        // O'qlar (Bullets)
        bullets.forEach((b, index) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
            
            // Dushmanga tegishi
            enemies.forEach((en, ei) => {
                let d = Math.sqrt((en.x-b.x)**2 + (en.y-b.y)**2);
                if(d < 30) {
                    enemies.splice(ei, 1);
                    bullets.splice(index, 1);
                    score++;
                    document.getElementById('frag-count').innerText = "KILLS: " + score;
                }
            });
        });

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
