<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Box Opener</title>
    <!-- Shriftdan foydalanish uchun Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            /* Brawl Stars-ga xos binafsha-ko'k rangli chiroyli gradient fon */
            background: radial-gradient(circle, #2c1654 0%, #12072b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Lobby Sarlavhasi */
        header {
            text-align: center;
            margin: 20px 0;
        }

        header h1 {
            font-family: 'Lilita One', cursive;
            font-size: 3rem;
            color: #ffcc00;
            text-shadow: 4px 4px 0px #cc0000, -2px -2px 0px #000;
            letter-spacing: 2px;
            transform: skewX(-5deg);
        }

        /* Asosiy Lobby Konteyneri */
        .lobby-container {
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 300px; /* Quti ochish qismi va brawlerlar orasidagi joy */
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .lobby-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        /* CHAP TOMON: Brawlerlar ro'yxati */
        .brawlers-section h2 {
            font-family: 'Lilita One', cursive;
            color: #00e5ff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px #000;
        }

        .brawlers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #3d2375;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Personaj kartochkalari */
        .brawler-card {
            background: linear-gradient(135deg, #504099, #31256c);
            border: 3px solid #7952b3;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            position: relative;
            transition: transform 0.2s, filter 0.3s;
            cursor: pointer;
            filter: grayscale(100%) brightness(70%); /* Hali ochilmaganlar uchun kulrang effekt */
        }

        .brawler-card.unlocked {
            filter: grayscale(0%) brightness(100%);
            border-color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
            animation: unlock-pop 0.3s ease-out;
        }

        .brawler-card:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .brawler-avatar {
            font-size: 2.5rem;
            margin-bottom: 5px;
            display: block;
        }

        .brawler-name {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* Kamyoblik ranglari (Rarity) */
        .rare { border-color: #3cc41c !important; }
        .super-rare { border-color: #3b7fff !important; }
        .epic { border-color: #d633ff !important; }
        .mythic { border-color: #ff334b !important; }
        .legendary { border-color: #ffb133 !important; }

        /* O'NG TOMON: Quti va Resurslar */
        .box-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #1a0d36;
            height: fit-content;
        }

        .resources {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .res-item {
            background: #111;
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .gems { color: #00ff66; border-color: #00aa44; }
        .coins { color: #ffcc00; border-color: #cc9900; }

        /* Mega Box tugmasi va vizuali */
        .mega-box-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            position: relative;
            transition: transform 0.1s;
        }

        .mega-box-btn:active {
            transform: scale(0.9);
        }

        .box-graphic {
            font-size: 6rem;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.6));
            animation: float 3s ease-in-out infinite;
        }

        .btn-text {
            margin-top: 15px;
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            color: #331a00;
            font-family: 'Lilita One', cursive;
            font-size: 1.4rem;
            padding: 10px 25px;
            border-radius: 25px;
            border: 3px solid #fff;
            box-shadow: 0 5px 0 #b36b00, 0 8px 15px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.6);
        }

        /* 💥 MODAL VA ANIMATSIYA (Yangi personaj chiqqandagi ekran) */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            text-align: center;
            animation: brawler-reveal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-avatar {
            font-size: 8rem;
            display: block;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.8));
        }

        .modal-rarity {
            font-family: 'Lilita One', cursive;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .modal-name {
            font-family: 'Lilita One', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 5px 10px rgba(0,0,0,0.8);
            margin-bottom: 30px;
        }

        .close-modal-btn {
            background: #fff;
            color: #111;
            font-weight: bold;
            padding: 12px 40px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(255,255,255,0.3);
        }

        /* Animatsiyalar */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes brawler-reveal {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes unlock-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>BRAWL LOBBY</h1>
    </header>

    <div class="lobby-container">
        
        <!-- CHAP UPRAVLENIYA: Personajlar Galereyasi -->
        <div class="brawlers-section">
            <h2>Brawlerlar (<span id="unlocked-count">0</span>/10)</h2>
            <div class="brawlers-grid" id="brawlers-grid">
                <!-- Personajlar JavaScript orqali joylanadi -->
            </div>
        </div>

        <!-- O'NG UPRAVLENIYA: Quti ochish paneli -->
        <div class="box-section">
            <div class="resources">
                <div class="res-item coins">🪙 <span id="coin-count">0</span></div>
                <div class="res-item gems">💎 <span id="gem-count">80</span></div>
            </div>

            <button class="mega-box-btn" onclick="openMegaBox()">
                <div class="box-graphic">📦</div>
                <div class="btn-text">MEGA BOX (20 💎)</div>
            </button>
        </div>

    </div>

    <!-- Yangi personaj tushgandagi popup oyna -->
    <div class="modal" id="reward-modal">
        <div class="modal-content">
            <div class="modal-avatar" id="modal-avatar">🌵</div>
            <div class="modal-rarity" id="modal-rarity" style="color: #ffb133;">LEGENDARY</div>
            <div class="modal-name" id="modal-name">SPIKE</div>
            <button class="close-modal-btn" onclick="closeModal()">LOBBYGA QAYTISH</button>
        </div>
    </div>

    <script>
        // Haqiqiy Brawl Stars personajlari ma'lumotlar bazasi (Emoji va Rarity bilan)
        const brawlersData = [
            { id: 'shelly', name: 'Shelly', emoji: '🔫', rarity: 'rare', color: '#3cc41c' },
            { id: 'colt', name: 'Colt', emoji: '🤠', rarity: 'rare', color: '#3cc41c' },
            { id: 'el_primo', name: 'El Primo', emoji: '💪', rarity: 'super-rare', color: '#3b7fff' },
            { id: 'poco', name: 'Poco', emoji: '💀', rarity: 'super-rare', color: '#3b7fff' },
            { id: 'piper', name: 'Piper', emoji: '☂️', rarity: 'epic', color: '#d633ff' },
            { id: 'edgar', name: 'Edgar', emoji: '🧣', rarity: 'epic', color: '#d633ff' },
            { id: 'mortis', name: 'Mortis', emoji: '🧛', rarity: 'mythic', color: '#ff334b' },
            { id: 'taras', name: 'Tara', emoji: '🃏', rarity: 'mythic', color: '#ff334b' },
            { id: 'spike', name: 'Spike', emoji: '🌵', rarity: 'legendary', color: '#ffb133' },
            { id: 'crow', name: 'Crow', emoji: '🐦', rarity: 'legendary', color: '#ffb133' }
        ];

        // O'yin ichki holati (State)
        let userGems = 100;
        let userCoins = 0;
        let unlockedBrawlers = new Set();

        // Elementlarni chaqirib olish
        const grid = document.getElementById('brawlers-grid');
        const gemDisplay = document.getElementById('gem-count');
        const coinDisplay = document.getElementById('coin-count');
        const countDisplay = document.getElementById('unlocked-count');
        const modal = document.getElementById('reward-modal');

        // 1. Lobbyda personajlar kartochkalarini yaratish
        function initLobby() {
            grid.innerHTML = '';
            brawlersData.forEach(brawler => {
                const card = document.createElement('div');
                card.className = `brawler-card ${brawler.rarity}`;
                card.id = `card-${brawler.id}`;
                card.innerHTML = `
                    <span class="brawler-avatar">${brawler.emoji}</span>
                    <span class="brawler-name">${brawler.name}</span>
                `;
                grid.appendChild(card);
            });
            updateUI();
        }

        // 2. Resurslar va hisoblagichlarni yangilash
        function updateUI() {
            gemDisplay.textContent = userGems;
            coinDisplay.textContent = userCoins;
            countDisplay.textContent = unlockedBrawlers.size;

            // Ochilgan brawlerlarni rangli qilish
            unlockedBrawlers.forEach(id => {
                const card = document.getElementById(`card-${id}`);
                if (card && !card.classList.contains('unlocked')) {
                    card.classList.add('unlocked');
                }
            });
        }

        // 3. Mega Box ochish funksiyasi
        function openMegaBox() {
            if (userGems < 20) {
                alert("Gems yetarli emas! Sizga sovg'a sifatida 50 ta berildi.");
                userGems += 50;
                updateUI();
                return;
            }

            // Narxni yechish
            userGems -= 20;
            
            // Qutidan har doim tanga tushadi
            const coinsWon = Math.floor(Math.random() * 150) + 50; // 50-200 tanga
            userCoins += coinsWon;

            // Personaj tushish imkoniyati (Chance: 45%)
            if (Math.random() < 0.45) {
                // Hali ochilmagan brawlerlarni saralash
                const lockedBrawlers = brawlersData.filter(b => !unlockedBrawlers.has(b.id));
                
                if (lockedBrawlers.length > 0) {
                    // Tasodifiy brawler tanlash
                    const luckyBrawler = lockedBrawlers[Math.floor(Math.random() * lockedBrawlers.length)];
                    unlockedBrawlers.add(luckyBrawler.id);
                    
                    // Ekrandagi modalda ko'rsatish
                    showRewardModal(luckyBrawler);
                } else {
                    // Agar hamma personaj ochilgan bo'lsa bonu tanga beriladi
                    userCoins += 300;
                    alert(`Hamma personajlarni ochgansiz! Bonus: +300 Tanga!`);
                }
            } else {
                // Agar personaj chiqmasa shunchaki tanga haqida xabar berish
                alert(`Qutidan ${coinsWon} ta tanga chiqdi! Personaj chiqmadi, omadni yana sinab ko'ring.`);
            }

            updateUI();
        }

        // 4. Yangi personaj chiqqandagi animatsiyali ekran
        function showRewardModal(brawler) {
            document.getElementById('modal-avatar').textContent = brawler.emoji;
            const rarityElement = document.getElementById('modal-rarity');
            rarityElement.textContent = brawler.rarity.replace('-', ' ');
            rarityElement.style.color = brawler.color;
            document.getElementById('modal-name').textContent = brawler.name;
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Sayt yuklanganda ishga tushirish
        initLobby();
    </script>
</body>
</html>
