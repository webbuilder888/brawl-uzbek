<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Brawl Ultra: Evolution</title>
    <style>
        :root { 
            --gold: #ffd700; --crystal: #ae00ff; --exp: #00ff88;
            --p-color: #00d2ff; --e-color: #ff4444; 
        }
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Segoe UI', Roboto, sans-serif; touch-action: none; }
        canvas { display: none; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        
        /* MODERN UI */
        #lobby { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #1a2a6c, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .stats-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; }
        .stat-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); font-weight: bold; }
        
        .char-box { width: 140px; height: 180px; background: linear-gradient(to bottom, var(--p-color), #0055ff); border-radius: 30px; box-shadow: 0 0 50px var(--p-color); margin: 30px; position: relative; animation: float 3s ease-in-out infinite; }
        .char-box::after { content: 'LVL 1'; position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); font-size: 20px; color: var(--exp); }
        
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-20px) rotate(-2deg); } }
        
        .btn { padding: 18px 80px; font-size: 28px; border-radius: 50px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 900; transition: 0.2s; letter-spacing: 2px; }
        .play-btn { background: linear-gradient(#ffcc00, #ff9900); color: #000; box-shadow: 0 10px 0 #cc7700; }
        .play-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #cc7700; }

        /* IN-GAME UI */
        #game-ui { position: absolute; top: 20px; left: 20px; display: none; z-index: 50; width: 250px; }
        .progress-container { background: rgba(0,0,0,0.5); border-radius: 10px; height: 12px; margin: 5px 0; border: 1px solid #555; }
        .bar { height: 100%; transition: 0.3s; border-radius: 10px; }
        
        .joy-zone { position: absolute; bottom: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); display: none; }
        .handle { position: absolute; width: 55px; height: 55px; background: rgba(255,255,255,0.3); border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="stats-bar">
            <div class="stat-card" style="color: var(--gold);">🪙 <span id="l-coins">0</span></div>
            <div class="stat-card" style="color: var(--crystal);">💎 <span id="l-gems">0</span></div>
        </div>
        <h1 style="font-size: 60px; margin: 0; text-shadow: 0 0 20px var(--p-color);">BRAWL ULTRA</h1>
        <div class="char-box" id="lobby-char"></div>
        <button class="play-btn btn" onclick="startGame()">BATTLE</button>
    </div>

    <div id="game-ui">
        <div style="color: white; font-weight: bold;">LVL <span id="lvl-txt">1</span></div>
        <div class="progress-container"><div id="exp-bar" class="bar" style="width: 0%; background: var(--exp);"></div></div>
        <div class="progress-container"><div id="hp-bar" class="bar" style="width: 100%; background: #ff4444;"></div></div>
    </div>

    <div class="joy-zone" id="move-joy" style="left: 50px;"><div class="handle"></div></div>
    <div class="joy-zone" id="aim-joy" style="right: 50px;"><div class="handle"></div></div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Stats & Leveling
    let coins = 0, gems = 0, exp = 0, lvl = 1, expNeeded = 100;
    let frames = 0, isGameRunning = false;

    let player = { x: 0, y: 0, size: 28, hp: 100, maxHp: 100, speed: 5, damage: 1 };
    let enemies = [], bullets = [], drops = [];

    const joys = { move: { x: 0, y: 0, id: null }, aim: { x: 0, y: 0, active: false } };

    function setupJoy(id, type) {
        const zone = document.getElementById(id);
        const handle = zone.querySelector('.handle');
        const handleInput = (e) => {
            e.preventDefault();
            const t = e.targetTouches ? Array.from(e.targetTouches).find(tt => tt.target === zone || zone.contains(tt.target)) : e;
            if(!t) return;
            let dx = t.clientX - (zone.offsetLeft + 65), dy = t.clientY - (zone.offsetTop + 65);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const angle = Math.atan2(dy, dx);
            joys[type].x = (Math.cos(angle) * dist) / 50;
            joys[type].y = (Math.sin(angle) * dist) / 50;
            handle.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
            if(type === 'aim' && dist > 15) joys.aim.active = true;
        };
        const reset = () => { joys[type].x = 0; joys[type].y = 0; joys.aim.active = false; handle.style.transform = `translate(-50%, -50%)`; };
        zone.addEventListener('touchstart', handleInput); zone.addEventListener('touchmove', handleInput);
        zone.addEventListener('touchend', reset);
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.querySelectorAll('.joy-zone, #game-ui').forEach(el => el.style.display = 'block');
        canvas.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        player.x = canvas.width/2; player.y = canvas.height/2;
        setupJoy('move-joy', 'move'); setupJoy('aim-joy', 'aim');
        isGameRunning = true; update();
    }

    function addExp(amount) {
        exp += amount;
        if(exp >= expNeeded) {
            lvl++; exp = 0; expNeeded *= 1.5;
            player.maxHp += 20; player.hp = player.maxHp;
            player.damage += 0.5;
            document.getElementById('lvl-txt').innerText = lvl;
            alert("LEVEL UP! 💪 Kuchingiz ortdi!");
        }
        document.getElementById('exp-bar').style.width = (exp / expNeeded * 100) + "%";
    }

    function update() {
        if(!isGameRunning) return;
        frames++; ctx.fillStyle = '#111811'; ctx.fillRect(0,0,canvas.width, canvas.height);
        
        // Grid Effect (Grafika uchun)
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }

        // Player Move & Draw
        player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x + joys.move.x * player.speed));
        player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y + joys.move.y * player.speed));
        
        // Personajni chiroyli chizish
        ctx.shadowBlur = 20; ctx.shadowColor = '#00d2ff';
        ctx.fillStyle = '#00d2ff'; ctx.beginPath(); ctx.roundRect(player.x-20, player.y-25, 40, 50, 10); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(player.x-8, player.y-10, 4, 0, Math.PI*2); ctx.arc(player.x+8, player.y-10, 4, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // Firing
        if(joys.aim.active && frames % 10 === 0) {
            bullets.push({ x: player.x, y: player.y, vx: joys.aim.x*14, vy: joys.aim.y*14 });
        }

        // Bullets & Collision
        bullets.forEach((b, bi) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, Math.PI*2); ctx.fill();
            
            enemies.forEach((e, ei) => {
                let dist = Math.hypot(e.x - b.x, e.y - b.y);
                if(dist < 30) {
                    e.hp -= player.damage; bullets.splice(bi, 1);
                    if(e.hp <= 0) {
                        enemies.splice(ei, 1); addExp(25); coins += 5;
                        drops.push({x: e.x, y: e.y, type: Math.random()>0.8?'gem':'coin'});
                    }
                }
            });
        });

        // Enemies
        if(frames % (Math.max(20, 100 - lvl*5)) === 0) {
            let side = Math.random() > 0.5;
            enemies.push({ x: side?Math.random()*canvas.width:0, y: side?0:Math.random()*canvas.height, hp: 2 + lvl });
        }
        enemies.forEach((e, i) => {
            let angle = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(angle) * (1.5 + lvl*0.2); e.y += Math.sin(angle) * (1.5 + lvl*0.2);
            ctx.fillStyle = '#ff4444'; ctx.beginPath(); ctx.roundRect(e.x-20, e.y-20, 40, 40, 8); ctx.fill();
            if(Math.hypot(player.x-e.x, player.y-e.y) < 40) {
                player.hp -= 0.3;
                document.getElementById('hp-bar').style.width = (player.hp/player.maxHp*100) + "%";
            }
        });

        // Drops
        drops.forEach((d, i) => {
            ctx.fillStyle = d.type==='coin'?'#ffd700':'#ae00ff';
            ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI*2); ctx.fill();
            if(Math.hypot(player.x-d.x, player.y-d.y) < 40) {
                if(d.type==='gem') gems++; else coins += 10;
                drops.splice(i, 1);
                document.getElementById('l-coins').innerText = coins;
                document.getElementById('l-gems').innerText = gems;
            }
        });

        if(player.hp <= 0) { alert("GAME OVER! LVL: " + lvl); location.reload(); }
        requestAnimationFrame(update);
    }
</script>
</body>
</html>
