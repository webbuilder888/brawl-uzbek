<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haqiqiy Brawl Stars Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Lilita One', cursive;
            user-select: none;
        }

        body {
            /* Haqiqiy o'yin ichidagi dinamik neonli fon rasmi */
            background: url('https://images.alphacoders.com/134/1341053.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- 1. TEPA PANEL (TOP BAR) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 20px 5px 5px;
            border-radius: 40px;
            border: 3px solid #fff;
        }

        .profile-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffcc00;
            border: 2px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
        }

        .profile-name {
            font-size: 1.4rem;
            text-shadow: 2px 2px 0 #000;
            color: #fff;
        }

        .stats-section {
            display: flex;
            gap: 15px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 20px;
            border-radius: 25px;
            border: 3px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            text-shadow: 2px 2px 0 #000;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .stat-box img { width: 28px; height: 28px; object-fit: contain; }
        .coins { color: #ffeb3b; border-color: #ff9800; }
        .gems { color: #00e676; border-color: #00c853; }

        /* --- 2. MARKAZIY QISM (MAIN LOBBY SCREEN) --- */
        .main-lobby {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            position: relative;
        }

        /* Chap menyu: Brawler tanlash va statistika */
        .left-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 5;
        }

        .menu-btn {
            background: linear-gradient(180deg, #2196f3 0%, #0d47a1 100%);
            border: 3px solid #fff;
            padding: 12px 25px;
            border-radius: 15px;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 5px 0 #0a3375, 0 8px 10px rgba(0,0,0,0.5);
            transform: skewX(-7deg);
            transition: 0.1s;
        }

        .menu-btn:active {
            transform: skewX(-7deg) translateY(4px);
            box-shadow: 0 1px 0 #0a3375;
        }

        /* Markazda turadigan ulkan Brawler */
        .brawler-display {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .active-brawler-img {
            height: 450px;
            object-fit: contain;
            filter: drop-shadow(0px 20px 25px rgba(0,0,0,0.6));
            animation: brawlerFloat 4s ease-in-out infinite;
        }

        /* O'ng menyu: Mega Box (Quti ochish joyi) */
        .right-menu {
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #ffcc00;
        }

        .mega-box-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mega-box-img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            animation: boxWobble 3s ease-in-out infinite;
        }

        .box-price {
            margin-top: 10px;
            background: #ff9800;
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #fff;
            font-size: 1.1rem;
            text-shadow: 1px 1px 0 #000;
        }

        /* --- 3. PASTKI PANEL (BOTTOM BAR / PLAY BUTTON) --- */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0 40px 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
        }

        /* Original Brawl Stars Sariq/To'q sariq JANG tugmasi */
        .play-btn {
            background: linear-gradient(180deg, #ffeb3b 0%, #ff5722 100%);
            border: 5px solid #fff;
            padding: 18px 90px;
            border-radius: 25px;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 4px 4px 0px #791b00, -2px -2px 0px #000, 3px -2px 0px #000;
            cursor: pointer;
            box-shadow: 0 10px 0 #b32d00, 0 15px 25px rgba(0,0,0,0.6);
            transform: skewX(-8deg);
            letter-spacing: 2px;
            transition: 0.1s;
        }

        .play-btn:active {
            transform: skewX(-8deg) translateY(8px);
            box-shadow: 0 2px 0 #b32d00, 0 5px 10px rgba(0,0,0,0.5);
        }

        /* --- REWARD MODAL (Yangi personaj ekrani) --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(106,27,154,0.95) 0%, rgba(13,71,161,0.95) 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            text-align: center;
            animation: revealBrawler 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-img {
            width: 320px;
            height: 320px;
            object-fit: contain;
            filter: drop-shadow(0 0 30px #fff);
        }

        .modal-name {
            font-size: 5rem;
            color: #fff;
            text-shadow: 5px 5px 0px #000;
            margin-top: 10px;
            transform: skewX(-6deg);
        }

        .close-btn {
            margin-top: 25px;
            background: #fff;
            color: #000;
            font-size: 1.4rem;
            padding: 10px 50px;
            border-radius: 30px;
            border: 3px solid #000;
            cursor: pointer;
        }

        /* --- ANIMATSIYALAR --- */
        @keyframes brawlerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes boxWobble {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(3deg); }
        }

        @keyframes revealBrawler {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="profile-section">
            <div class="profile-icon">🤠</div>
            <div class="profile-name">PLAYER 1</div>
        </div>
        <div class="stats-section">
            <div class="stat-box coins">
                <img src="https://cdn.wikiisland.org/images/b/b5/Coin.png" alt="Coin">
                <span id="coin-count">0</span>
            </div>
            <div class="stat-box gems">
                <img src="https://cdn.wikiisland.org/images/2/23/Gem.png" alt="Gem">
                <span id="gem-count">100</span>
            </div>
        </div>
    </div>

    <div class="main-lobby">
        
        <div class="left-menu">
            <button class="menu-btn" onclick="changeBrawler()">KEYINGI QAHRAMON ➡️</button>
            <div style="text-shadow: 2px 2px 0 #000; font-size: 1.2rem;">OCHILDI: <span id="unlock-status">1/5</span></div>
        </div>

        <div class="brawler-display">
            <img class="active-brawler-img" id="active-brawler" src="https://cdn.wikiisland.org/images/3/3d/Shelly_Portrait.png" alt="Brawler">
        </div>

        <div class="right-menu">
            <button class="mega-box-btn" onclick="openMegaBox()">
                <img class="mega-box-img" src="https://cdn.wikiisland.org/images/c/c2/Mega_Box.png" alt="Mega Box">
                <div class="box-price">20 💎</div>
            </button>
        </div>

    </div>

    <div class="bottom-bar">
        <button class="play-btn" onclick="openMegaBox()">BRAWL BOX</button>
    </div>

    <div class="modal" id="reward-modal">
        <div class="modal-content">
            <img class="modal-img" id="modal-img" src="" alt="Brawler">
            <div style="color: #ffcc00; font-size: 2rem; text-shadow: 2px 2px 0 #000;">YANGI BRAWLER!</div>
            <div class="modal-name" id="modal-name">SPIKE</div>
            <button class="close-btn" onclick="closeModal()">LOBBYGA QAYTISH</button>
        </div>
    </div>

    <script>
        // Lobbyda aylanadigan original to'liq personajlar rasmlari
        const brawlersDatabase = [
            { id: 'shelly', name: 'Shelly', img: 'https://cdn.wikiisland.org/images/3/3d/Shelly_Portrait.png', unlocked: true },
            { id: 'colt', name: 'Colt', img: 'https://cdn.wikiisland.org/images/5/54/Colt_Portrait.png', unlocked: false },
            { id: 'el_primo', name: 'El Primo', img: 'https://cdn.wikiisland.org/images/a/ab/El_Primo_Portrait.png', unlocked: false },
            { id: 'mortis', name: 'Mortis', img: 'https://cdn.wikiisland.org/images/2/24/Mortis_Portrait.png', unlocked: false },
            { id: 'spike', name: 'Spike', img: 'https://cdn.wikiisland.org/images/1/19/Spike_Portrait.png', unlocked: false }
        ];

        let currentBrawlerIndex = 0;
        let userGems = 100;
        let userCoins = 0;

        function updateLobbyUI() {
            document.getElementById('coin-count').textContent = userCoins;
            document.getElementById('gem-count').textContent = userGems;

            // Qancha brawler ochilganini hisoblash
            const unlockedCount = brawlersDatabase.filter(b => b.unlocked).length;
            document.getElementById('unlock-status').textContent = `${unlockedCount}/${brawlersDatabase.length}`;

            // Markazdagi brawlerni ko'rsatish
            const currentBrawler = brawlersDatabase[currentBrawlerIndex];
            const brawlerImgElement = document.getElementById('active-brawler');
            brawlerImgElement.src = currentBrawler.img;

            // Agar brawler hali qulflangan bo'lsa, uni qora ko'rinishda ko'rsatish
            if (!currentBrawler.unlocked) {
                brawlerImgElement.style.filter = "brightness(0%) drop-shadow(0px 20px 25px rgba(0,0,0,0.8))";
            } else {
                brawlerImgElement.style.filter = "brightness(100%) drop-shadow(0px 20px 25px rgba(0,0,0,0.6))";
            }
        }

        // Chap tomondagi tugma bosilganda brawlerlarni almashtirish
        function changeBrawler() {
            currentBrawlerIndex = (currentBrawlerIndex + 1) % brawlersDatabase.length;
            updateLobbyUI();
        }

        // Quti ochish funksiyasi
        function openMegaBox() {
            if (userGems < 20) {
                alert("Gems yetarli emas! Sizga 80 💎 ta qo'shildi.");
                userGems += 80;
                updateLobbyUI();
                return;
            }

            userGems -= 20;
            userCoins += Math.floor(Math.random() * 150) + 50;

            // Qulflangan brawlerlarni tekshirish
            const lockedBrawlers = brawlersDatabase.filter(b => !b.unlocked);

            if (lockedBrawlers.length > 0 && Math.random() < 0.60) { // 60% imkoniyat
                const luckyBrawler = lockedBrawlers[Math.floor(Math.random() * lockedBrawlers.length)];
                luckyBrawler.unlocked = true;
                
                // Unlocked ekranni ochish
                showRewardModal(luckyBrawler);
            } else {
                alert("Qutidan faqat oltin tangalar chiqdi! Personaj chiqmadi.");
            }

            updateLobbyUI();
        }

        function showRewardModal(brawler) {
            const modal = document.getElementById('reward-modal');
            document.getElementById('modal-img').src = brawler.img;
            document.getElementById('modal-name').textContent = brawler.name;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('reward-modal').style.display = 'none';
            updateLobbyUI();
        }

        // O'yinni boshlash
        updateLobbyUI();
    </script>
</body>
</html>
