<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Ultra Graphics</title>
    <style>
        :root {
            --p-color: #00d2ff; --e-color: #ff0055; --s-color: #ffaa00;
        }
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Ubuntu', sans-serif; touch-action: none; }
        canvas { display: block; }

        /* Neon UI */
        #ui { position: absolute; top: 15px; left: 15px; pointer-events: none; }
        .stat-card {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 15px;
            border-left: 5px solid var(--p-color);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .bar { width: 200px; height: 14px; background: #1a1a1a; border-radius: 7px; margin-top: 8px; border: 1px solid #333; position: relative; overflow: hidden; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00ff88, #00d2ff); box-shadow: 0 0 10px #00ff88; transition: 0.3s; }
        #super-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffaa00, #ff0000); box-shadow: 0 0 10px #ffaa00; transition: 0.3s; }
        #kills { color: white; font-weight: 900; font-size: 18px; letter-spacing: 2px; }

        /* Modern Joysticks */
        .joy-zone {
            position: absolute; bottom: 40px; width: 130px; height: 130px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            border: 2px solid rgba(255,255,255,0.1); border-radius: 50%;
        }
        #move-joy { left: 40px; }
        #aim-joy { right: 40px; border-color: rgba(255, 170, 0, 0.2); }
        .handle {
            position: absolute; width: 55px; height: 55px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            left: 50%; top: 50%; transform: translate(-50%, -50%);
        }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); padding: 40px; border-radius: 30px;
            text-align: center; color: white; display: none; border: 2px solid var(--p-color);
            box-shadow: 0 0 50px rgba(0,210,255,0.4); pointer-events: auto;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div class="stat-card">
            <div id="kills">FRAGS: 0</div>
            <div class="bar"><div id="hp-fill"></div></div>
            <div class="bar"><div id="super-fill"></div></div>
        </div>
    </div>

    <div class="joy-zone" id="move-joy"><div class="handle"></div></div>
    <div class="joy-zone" id="aim-joy"><div class="handle"></div></div>

    <div id="game-over">
        <h1 style="font-size: 48px; margin: 0; color: #ff0055;">WASTED</h1>
        <p id="final" style="font-size: 20px; margin: 20px 0;"></p>
        <button onclick="location.reload()" style="background: var(--p-color); border: none; padding: 15px 40px; color: white; font-weight: bold; border-radius: 10px; cursor: pointer;">REDEPLOY</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    let score = 0, isGameOver = false, superMode = false, superCharge = 0, frames = 0;
    let player = { x: canvas.width/2, y: canvas.height/2, hp: 100, size: 22 };
    let enemies = [], bullets = [], particles = [], trails = [];

    // --- JOYSCRIPT LOGIC ---
    const joys = { move: { x:0, y:0 }, aim: { x:0, y:0 }, firing: false };
    function setupJoy(id, callback) {
        const zone = document.getElementById(id);
        const handle = zone.querySelector('.handle');
        const update = (e) => {
            e.preventDefault();
            const t = e.touches ? e.touches[0] : e;
            let dx = t.clientX - (zone.offsetLeft + 65);
            let dy = t.clientY - (zone.offsetTop + 65);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const angle = Math.atan2(dy, dx);
            dx = Math.cos(angle) * dist; dy = Math.sin(angle) * dist;
            handle.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            callback(dx/50, dy/50, dist > 20);
        };
        const reset = () => { handle.style.transform = `translate(-50%, -50%)`; callback(0, 0, false); };
        zone.addEventListener('touchstart', update); zone.addEventListener('touchmove', update);
        zone.addEventListener('touchend', reset);
    }
    setupJoy('move-joy', (x, y) => { joys.move.x = x; joys.move.y = y; });
    setupJoy('aim-joy', (x, y, active) => { joys.aim.x = x; joys.aim.y = y; joys.firing = active; });

    // --- EFFECTS ---
    function spawnPart(x, y, color) {
        for(let i=0; i<15; i++) particles.push({ x, y, vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12, life:1, c:color, s:Math.random()*4+2 });
    }

    // --- GAME LOOP ---
    function draw() {
        if(isGameOver) return;
        frames++;
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Grid Effect
        ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

        // Player Move & Draw
        player.x += joys.move.x * 5; player.y += joys.move.y * 5;
        // Bloom/Glow Player
        ctx.shadowBlur = 25; ctx.shadowColor = superMode ? '#ffaa00' : '#00d2ff';
        ctx.fillStyle = superMode ? '#ffaa00' : '#00d2ff';
        ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // Firing Logic
        if(joys.firing && frames % (superMode ? 4 : 8) === 0) {
            let angle = Math.atan2(joys.aim.y, joys.aim.x);
            let count = superMode ? 3 : 1;
            for(let i=0; i<count; i++) {
                let s = (Math.random()-0.5)*0.3;
                bullets.push({ x:player.x, y:player.y, vx:Math.cos(angle+s)*15, vy:Math.sin(angle+s)*15, sm:superMode });
            }
        }

        // Bullets & Trails
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = b.sm ? '#ffaa00' : '#fff';
            ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
            if(b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) bullets.splice(i, 1);
        });

        // Enemies
        if(frames % 60 === 0) {
            let x = Math.random() < 0.5 ? -50 : canvas.width + 50;
            let y = Math.random() * canvas.height;
            enemies.push({ x, y, hp: 2 + (score/10), s: 20 });
        }

        enemies.forEach((e, i) => {
            let dx = player.x - e.x, dy = player.y - e.y, d = Math.sqrt(dx*dx+dy*dy);
            e.x += (dx/d)*2; e.y += (dy/d)*2;
            
            // Draw Enemy with Glow
            ctx.shadowBlur = 15; ctx.shadowColor = '#ff0055';
            ctx.fillStyle = '#ff0055';
            ctx.beginPath(); ctx.arc(e.x, e.y, e.s, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Collision Player
            if(d < player.size + e.s) {
                player.hp -= 0.5;
                document.getElementById('hp-fill').style.width = player.hp + "%";
                if(player.hp <= 0) { isGameOver = true; document.getElementById('game-over').style.display='block'; document.getElementById('final').innerText = `SCORE: ${score}`; }
            }

            // Collision Bullet
            bullets.forEach((b, bi) => {
                let hitD = Math.sqrt((e.x-b.x)**2 + (e.y-b.y)**2);
                if(hitD < e.s) {
                    e.hp -= b.sm ? 2 : 1; bullets.splice(bi, 1);
                    if(e.hp <= 0) {
                        spawnPart(e.x, e.y, '#ff0055');
                        enemies.splice(i, 1); score++;
                        superCharge = Math.min(100, superCharge + 5);
                        document.getElementById('kills').innerText = `FRAGS: ${score}`;
                        document.getElementById('super-fill').style.width = superCharge + "%";
                    }
                }
            });
        });

        // Super Mode Logic
        if(superCharge >= 100 && !superMode) {
             superMode = true;
             setTimeout(() => { superMode = false; superCharge = 0; document.getElementById('super-fill').style.width = "0%"; }, 6000);
        }

        // Particles
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.03;
            ctx.fillStyle = p.c; ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
