<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Brawl Ultra Fix</title>
    <style>
        :root { --gold: #ffd700; --crystal: #ae00ff; }
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: none; touch-action: none; }

        /* LOBBY */
        #lobby { 
            position: absolute; width: 100%; height: 100%; 
            background: linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbb2d);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; 
        }
        
        .stats-top { position: absolute; top: 10px; display: flex; gap: 15px; }
        .currency { background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px; border: 1px solid #fff; font-weight: bold; }
        
        #shelly-img-lobby { width: 150px; height: 180px; object-fit: contain; margin-bottom: 20px; }
        
        .btn { padding: 15px 40px; font-size: 22px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .play-btn { background: #ffcc00; color: #000; box-shadow: 0 5px #cc9900; margin-bottom: 10px; }
        .box-btn { background: #3498db; color: #fff; box-shadow: 0 5px #2980b9; font-size: 16px; }

        /* JOYSTICKS */
        .joy-zone { position: absolute; bottom: 30px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; display: none; z-index: 60; border: 2px solid #fff; }
        .handle { position: absolute; width: 40px; height: 40px; background: #fff; border-radius: 50%; left: 30px; top: 30px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="stats-top">
            <div class="currency" style="color: var(--gold);">🪙 <span id="l-coins">0</span></div>
            <div class="currency" style="color: var(--crystal);">💎 <span id="l-gems">0</span></div>
        </div>
        <!-- Agar rasm yuklanmasa, alt matni chiqadi -->
        <img id="shelly-img-lobby" src="https://vignette.wikia.nocookie.net/brawlstars/images/e/e0/Shelly_Portrait.png" alt="SHELLY">
        
        <button class="play-btn btn" onclick="startGame()">BATTLE</button>
        <button class="box-btn btn" onclick="openBox()">OPEN BOX (100 🪙)</button>
    </div>

    <div id="move-joy" class="joy-zone" style="left: 40px;"><div class="handle"></div></div>
    <div id="aim-joy" class="joy-zone" style="right: 40px;"><div class="handle"></div></div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // RASMLARNI XAVFSIZ YUKLASH
    const shellyImg = new Image();
    shellyImg.src = 'https://vignette.wikia.nocookie.net/brawlstars/images/e/e0/Shelly_Portrait.png';
    let imgReady = false;
    shellyImg.onload = () => { imgReady = true; };

    let coins = localStorage.getItem('coins') ? parseInt(localStorage.getItem('coins')) : 0;
    let gems = localStorage.getItem('gems') ? parseInt(localStorage.getItem('gems')) : 0;
    let isRunning = false, frames = 0;

    function updateLobby() {
        document.getElementById('l-coins').innerText = coins;
        document.getElementById('l-gems').innerText = gems;
        localStorage.setItem('coins', coins);
        localStorage.setItem('gems', gems);
    }
    updateLobby();

    function openBox() {
        if (coins >= 100) {
            coins -= 100;
            gems += Math.floor(Math.random() * 10) + 2;
            updateLobby();
        }
    }

    let player = { x: 0, y: 0, hp: 100, speed: 5 };
    let enemies = [], bullets = [], joys = { move: { x: 0, y: 0, active: false }, aim: { x: 0, y: 0, active: false } };

    function setupJoy(id, type) {
        const el = document.getElementById(id);
        const handle = el.querySelector('.handle');
        const cx = el.offsetLeft + 50, cy = el.offsetTop + 50;

        const move = (e) => {
            e.preventDefault();
            const t = e.touches[0];
            let dx = t.clientX - cx, dy = t.clientY - cy;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const ang = Math.atan2(dy, dx);
            joys[type].x = (Math.cos(ang) * dist) / 40;
            joys[type].y = (Math.sin(ang) * dist) / 40;
            handle.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
            joys[type].active = dist > 5;
        };
        const stop = () => { joys[type].active = false; joys[type].x = 0; joys[type].y = 0; handle.style.transform = `translate(0,0)`; };
        el.addEventListener('touchstart', move); el.addEventListener('touchmove', move); el.addEventListener('touchend', stop);
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.querySelectorAll('.joy-zone').forEach(j => j.style.display = 'block');
        canvas.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        player.x = canvas.width/2; player.y = canvas.height/2;
        setupJoy('move-joy', 'move'); setupJoy('aim-joy', 'aim');
        isRunning = true; loop();
    }

    function loop() {
        if (!isRunning) return;
        frames++;
        
        // QORA EKRAN BO'LMASLIGI UCHUN FOZNI DOIMO CHIZAMIZ
        ctx.fillStyle = '#2d5a27'; 
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Player harakati
        player.x += joys.move.x * player.speed;
        player.y += joys.move.y * player.speed;
        
        // Shellyni chizish (Rasm yuklanmagan bo'lsa shakl chiziladi)
        ctx.save();
        ctx.translate(player.x, player.y);
        if (joys.aim.active) ctx.rotate(Math.atan2(joys.aim.y, joys.aim.x) + Math.PI/2);
        
        if (imgReady) {
            ctx.drawImage(shellyImg, -25, -35, 50, 70);
        } else {
            ctx.fillStyle = '#9b59b6';
            ctx.fillRect(-20, -30, 40, 60); // Shelly o'rniga vaqtincha quti
        }
        ctx.restore();

        // O'qlar
        if (joys.aim.active && frames % 10 === 0) {
            bullets.push({ x: player.x, y: player.y, vx: joys.aim.x*12, vy: joys.aim.y*12 });
        }
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
            if(b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) bullets.splice(i,1);
        });

        // Dushmanlar
        if (frames % 60 === 0) enemies.push({ x: Math.random()*canvas.width, y: -20, hp: 2 });
        enemies.forEach((e, i) => {
            let dx = player.x-e.x, dy = player.y-e.y, d = Math.sqrt(dx*dx+dy*dy);
            e.x += (dx/d)*2; e.y += (dy/d)*2;
            ctx.fillStyle = 'red'; ctx.fillRect(e.x-15, e.y-15, 30, 30);
            
            bullets.forEach((b, bi) => {
                if (Math.hypot(b.x-e.x, b.y-e.y) < 25) {
                    e.hp--; bullets.splice(bi,1);
                    if (e.hp <= 0) { enemies.splice(i,1); coins += 10; updateLobby(); }
                }
            });
            if (d < 30) player.hp -= 0.5;
        });

        // HP BAR
        ctx.fillStyle = '#000'; ctx.fillRect(player.x-25, player.y-50, 50, 6);
        ctx.fillStyle = '#00ff00'; ctx.fillRect(player.x-25, player.y-50, (player.hp/100)*50, 6);

        if (player.hp <= 0) { isRunning = false; alert("YUTQAZDINGIZ!"); location.reload(); }
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
