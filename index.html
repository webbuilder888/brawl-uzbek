<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaxsiy Sahifa</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            /* Chuqur, premium quyuq fondagi gradient */
            background: radial-gradient(circle at center, #161224 0%, #0a0712 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi harakatlanuvchi zamonaviy neon disklari */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
            top: 30%;
            left: 20%;
            border-radius: 50%;
            filter: blur(40px);
            animation: pulseGlow 8s ease-in-out infinite alternate;
            z-index: 1;
        }

        .bg-glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 60%);
            bottom: 20%;
            right: 15%;
            border-radius: 50%;
            filter: blur(50px);
            animation: pulseGlow 12s ease-in-out infinite alternate-reverse;
            z-index: 1;
        }

        /* Ism joylashgan asosiy blok */
        .name-wrapper {
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: fadeInUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Ismning premium dizayni */
        .main-name {
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 10px;
            position: relative;
            
            /* Zamonaviy gradient matn effekti */
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Yengil va nafis soya */
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.7));
            animation: textFloat 5s ease-in-out infinite;
        }

        /* Ism ostidagi ingichka chiroyli chiziq yoki kichik matn */
        .sub-text {
            font-size: 1rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 15px;
            opacity: 0;
            animation: fadeIn 2s ease forwards 0.8s;
        }

        /* --- SILLIQ VA PROFESSIONAL ANIMATSIYALAR --- */
        
        /* Sayt ochilganda ismning pastdan mayin chiqib kelishi */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ostidagi matnning sekin paydo bo'lishi */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Ismning havodagidek silliq va mayin suzib turishi */
        @keyframes textFloat {
            0%, 100% {
                transform: translateY(0px);
                filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.7));
            }
            50% {
                transform: translateY(-10px);
                filter: drop-shadow(0 30px 40px rgba(99, 102, 241, 0.2));
            }
        }

        /* Orqa fondagi yorug'likning o'zgarib turishi */
        @keyframes pulseGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }

        /* Mobil qurilmalar uchun mukammal moslashuvuvchanlik (Responsive) */
        @media (max-width: 768px) {
            .main-name {
                font-size: 3.8rem;
                letter-spacing: -1px;
            }
            .sub-text {
                font-size: 0.8rem;
                letter-spacing: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="name-wrapper">
        <h1 class="main-name">UKRAINAGA GETISHIMIZA 8 GUNU 5 SAT QOLDI </h1> 
        
        <div class="sub-text">Welcome to my space</div>
    </div>

</body>
</html>
