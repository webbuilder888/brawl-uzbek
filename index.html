<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Haqiqiy Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Lilita One', cursive;
            user-select: none;
        }

        body {
            /* Rasmiy va sinmaydigan Brawl Stars binafsha-ko'k neonli fon tasviri */
            background: radial-gradient(circle, #2d1354 0%, #110724 60%, #05010d 100%);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(214, 51, 255, 0.15) 0%, transparent 40%),
                url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Brawl_Stars_logo.svg/1200px-Brawl_Stars_logo.svg.png');
            background-repeat: no-repeat;
            background-position: center 25%;
            background-size: cover;
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Ustki qatlam - o'yin atmosferasi uchun */
        .ambient-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- 1. TEPA PANEL (TOP BAR) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 10;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 100%);
            padding: 6px 25px 6px 6px;
            border-radius: 50px;
            border: 4px solid #fff;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        .profile-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #ffcc00;
            border: 3px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: 0 3px 0 #b38f00;
        }

        .profile-name {
            font-size: 1.6rem;
            text-shadow: 3px 3px 0 #000;
            color: #fff;
            letter-spacing: 1px;
        }

        .stats-section {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            background: linear-gradient(180deg, #2c2c2c 0%, #0f0f0f 100%);
            padding: 8px 25px;
            border-radius: 30px;
            border: 4px solid #444;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5), inset 0 0 8px rgba(0,0,0,0.8);
        }

        .coins { color: #ffeb3b; border-color: #ff9800; }
        .gems { color: #00e676; border-color: #00c853; }

        /* --- 2. MARKAZIY QISM (LOBBY CORE) --- */
        .main-lobby {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            position: relative;
        }

        /* Chap Menyu */
        .left-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 5;
        }

        .menu-btn {
            background: linear-gradient(180deg, #00d2ff 0%, #0066ff 100%);
            border: 4px solid #fff;
            padding: 15px 30px;
            border-radius: 20px;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            text-shadow: 3px 3px 0 #000;
            box-shadow: 0 6px 0 #0044cc, 0 10px 15px rgba(0,0,0,0.4);
            transform: skewX(-10deg);
            transition: 0.1s;
        }

        .menu-btn:active {
            transform: skewX(-10deg) translateY(4px);
            box-shadow: 0 2px 0 #0044cc;
        }

        .status-text {
            font-size: 1.4rem;
            text-shadow: 3px 3px 0 #000;
            color: #00ffff;
            background: rgba(0,0,0,0.4);
            padding: 5px 15px;
            border-radius: 10px;
            width: fit-content;
        }

        /* 🕺 MARKAZDAGI ASOSIY PERSONAJ */
        .brawler-display {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -45%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .active-brawler-img {
            height: 480px;
            max-width: 400px;
            object-fit: contain;
            animation: brawlerFloat 3.5s ease-in-out infinite;
            transition: filter 0.3s ease;
        }

        /* O'ng Menyu: Premium Box */
        .right-menu {
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 8, 38, 0.75);
            padding: 25px;
            border-radius: 25px;
            border: 4px solid #ffcc00;
            box-shadow: 0 12px 25px rgba(0,0,0,0.6);
        }

        /* SVG yordamida chizilgan, sinmaydigan Mega Box */
        .box-svg-container {
            width: 150px;
            height: 150px;
            cursor: pointer;
            animation: boxWobble 3s ease-in-out infinite;
            transition: transform 0.1s;
        }

        .box-svg-container:active {
            transform: scale(0.9);
        }

        .box-price {
            margin-top: 15px;
            background: linear-gradient(180deg, #00e676 0%, #00a352 100%);
            padding: 6px 20px;
            border-radius: 20px;
            border: 3px solid #fff;
            font-size: 1.3rem;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 4px 0 #007038;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- 3. PASTKI PANEL (JANG TUGMASI) --- */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0 50px 0;
            z-index: 10;
        }

        .play-btn {
            background: linear-gradient(180deg, #fff200 0%, #ff6a00 100%);
            border: 5px solid #fff;
            padding: 20px 110px;
            border-radius: 25px;
            font-size: 3rem;
            color: #fff;
            text-shadow: 4px 4px 0px #993d00, -2px -2px 0px #000, 3px -2px 0px #000, -2px 3px 0px #000;
            cursor: pointer;
            box-shadow: 0 12px 0 #b34700, 0 15px 30px rgba(0,0,0,0.7);
            transform: skewX(-8deg);
            letter-spacing: 3px;
            transition: 0.1s;
        }

        .play-btn:active {
            transform: skewX(-8deg) translateY(8px);
            box-shadow: 0 4px 0 #b34700, 0 5px 15px rgba(0,0,0,0.5);
        }

        /* --- 🔥 REWARD MODAL (YANGI POLVON CHIQANDAGI EKRAN) --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(142,36,170,0.98) 0%, rgba(13,71,161,0.98) 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            text-align: center;
            animation: revealBrawler 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-img {
            height: 350px;
            object-fit: contain;
            filter: drop-shadow(0 0 30px #fff);
        }

        .modal-congrats {
            color: #ffcc00;
            font-size: 2.5rem;
            text-shadow: 3px 3px 0 #000;
            margin-top: 15px;
        }

        .modal-name {
            font-size: 5.5rem;
            color: #fff;
            text-shadow: 6px 6px 0px #000;
            transform: skewX(-6deg);
        }

        .close-btn {
            margin-top: 30px;
            background: #fff;
            color: #000;
            font-size: 1.5rem;
            padding: 12px 60px;
            border-radius: 40px;
            border: 4px solid #000;
            cursor: pointer;
            box-shadow: 0 6px 0 #999;
        }
        .close-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #999;
        }

        /* --- ANIMATSIYALAR --- */
        @keyframes brawlerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        @keyframes boxWobble {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.06) rotate(4deg); }
        }

        @keyframes revealBrawler {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="ambient-overlay"></div>

    <div class="top-bar">
        <div class="profile-section">
            <div class="profile-icon">👑</div>
            <div class="profile-name">BRAWLER UZ</div>
        </div>
        <div class="stats-section">
            <div class="stat-box coins">🪙 <span id="coin-count">0</span></div>
            <div class="stat-box gems">💎 <span id="gem-count">100</span></div>
        </div>
    </div>

    <div class="main-lobby">
        
        <div class="left-menu">
            <button class="menu-btn" onclick="changeBrawler()">ALMASHTIRISH ➡️</button>
            <div class="status-text">OCHILDI: <span id="unlock-status">1/5</span></div>
        </div>

        <div class="brawler-display">
            <img class="active-brawler-img" id="active-brawler" src="" alt="Brawler">
        </div>

        <div class="right-menu">
            <div class="box-svg-container" onclick="openMegaBox()">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <rect x="15" y="30" width="70" height="55" rx="10" fill="#0066ff" stroke="#fff" stroke-width="3"/>
                    <rect x="10" y="20" width="80" height="15" rx="5" fill="#ff334b" stroke="#fff" stroke-width="3"/>
                    <rect x="40" y="20" width="20" height="65" fill="#ffcc00"/>
                    <circle cx="50" cy="35" r="10" fill="#ffeb3b" stroke="#000" stroke-width="2"/>
                    <polygon points="50,30 53,37 60,37 55,41 57,48 50,44 43,48 45,41 40,37 47,37" fill="#fff"/>
                </svg>
            </div>
            <div class="box-price">20 💎</div>
        </div>

    </div>

    <div class="bottom-bar">
        <button class="play-btn" onclick="openMegaBox()">OPEN BOX</button>
    </div>

    <div class="modal" id="reward-modal">
        <div class="modal-content">
            <img class="modal-img" id="modal-img" src="" alt="Brawler">
            <div class="modal-congrats">YANGI POLVON!</div>
            <div class="modal-name" id="modal-name">SPIKE</div>
            <button class="close-btn" onclick="closeModal()">LOBBYGA QAYTISH</button>
        </div>
    </div>

    <script>
        // GitHub-da 100% ochiladigan rasmiy va to'g'ridan-to'g'ri render havolalari
        const brawlersDatabase = [
            { id: 'shelly', name: 'Shelly', img: 'https://raw.githubusercontent.com/brawlify/brawlify-assets/master/brawlers/borders/16000000.png', unlocked: true },
            { id: 'colt', name: 'Colt', img: 'https://raw.githubusercontent.com/brawlify/brawlify-assets/master/brawlers/borders/16000001.png', unlocked: false },
            { id: 'el_primo', name: 'El Primo', img: 'https://raw.githubusercontent.com/brawlify/brawlify-assets/master/brawlers/borders/16000004.png', unlocked: false },
            { id: 'mortis', name: 'Mortis', img: 'https://raw.githubusercontent.com/brawlify/brawlify-assets/master/brawlers/borders/16000008.png', unlocked: false },
            { id: 'spike', name: 'Spike', img: 'https://raw.githubusercontent.com/brawlify/brawlify-assets/master/brawlers/borders/16000009.png', unlocked: false }
        ];

        let currentBrawlerIndex = 0;
        let userGems = 100;
        let userCoins = 0;

        function updateLobbyUI() {
            document.getElementById('coin-count').textContent = userCoins;
            document.getElementById('gem-count').textContent = userGems;

            const unlockedCount = brawlersDatabase.filter(b => b.unlocked).length;
            document.getElementById('unlock-status').textContent = `${unlockedCount}/${brawlersDatabase.length}`;

            const currentBrawler = brawlersDatabase[currentBrawlerIndex];
            const brawlerImgElement = document.getElementById('active-brawler');
            brawlerImgElement.src = currentBrawler.img;

            // Qulflangan bo'lsa siluet (qora ko'rinish) effekti
            if (!currentBrawler.unlocked) {
                brawlerImgElement.style.filter = "brightness(0%) drop-shadow(0px 15px 20px rgba(0,0,0,0.9))";
            } else {
                brawlerImgElement.style.filter = "brightness(100%) drop-shadow(0px 20px 25px rgba(0,0,0,0.5))";
            }
        }

        function changeBrawler() {
            currentBrawlerIndex = (currentBrawlerIndex + 1) % brawlersDatabase.length;
            updateLobbyUI();
        }

        function openMegaBox() {
            if (userGems < 20) {
                alert("Kristallar tugadi! Sizga yana 100 💎 berildi.");
                userGems += 100;
                updateLobbyUI();
                return;
            }

            userGems -= 20;
            userCoins += Math.floor(Math.random() * 200) + 80;

            const lockedBrawlers = brawlersDatabase.filter(b => !b.unlocked);

            if (lockedBrawlers.length > 0 && Math.random() < 0.55) { // 55% imkoniyat
                const luckyBrawler = lockedBrawlers[Math.floor(Math.random() * lockedBrawlers.length)];
                luckyBrawler.unlocked = true;
                showRewardModal(luckyBrawler);
            }

            updateLobbyUI();
        }

        function showRewardModal(brawler) {
            const modal = document.getElementById('reward-modal');
            document.getElementById('modal-img').src = brawler.img;
            document.getElementById('modal-name').textContent = brawler.name;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('reward-modal').style.display = 'none';
            updateLobbyUI();
        }

        // O'yinni boshlash
        updateLobbyUI();
    </script>
</body>
</html>
