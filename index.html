<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Brawl Ultra: Shelly Edition</title>
    <style>
        :root { --gold: #ffd700; --crystal: #ae00ff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; touch-action: none; -webkit-user-select: none; }
        canvas { display: none; }

        /* LOBBY */
        #lobby { 
            position: absolute; width: 100%; height: 100%; 
            background: url('https://wallpaperaccess.com/full/1385418.jpg') center/cover;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; 
        }
        #lobby::before { content: ''; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: -1; }
        
        .stats-top { position: absolute; top: 20px; display: flex; gap: 20px; }
        .currency { background: rgba(0,0,0,0.8); padding: 10px 25px; border-radius: 30px; border: 2px solid #fff; font-size: 20px; }
        
        .shelly-png { width: 180px; filter: drop-shadow(0 0 20px #9b59b6); animation: idle 2s infinite ease-in-out; }
        @keyframes idle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        .btn-group { display: flex; gap: 20px; margin-top: 20px; }
        .btn { padding: 15px 50px; font-size: 25px; border-radius: 40px; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.1s; }
        .play-btn { background: #ffcc00; color: #000; box-shadow: 0 8px #cc9900; }
        .box-btn { background: #3498db; color: #fff; box-shadow: 0 8px #2980b9; }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px gray; }

        /* JOYSTICKS */
        .joy-zone { position: absolute; bottom: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 3px solid rgba(255,255,255,0.4); display: none; z-index: 60; }
        .handle { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.5); border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; pointer-events: none; }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="stats-top">
            <div class="currency" style="color: var(--gold);">🪙 <span id="l-coins">0</span></div>
            <div class="currency" style="color: var(--crystal);">💎 <span id="l-gems">0</span></div>
        </div>
        <img src="https://vignette.wikia.nocookie.net/brawlstars/images/e/e0/Shelly_Portrait.png/revision/latest?cb=20181212104052" class="shelly-png" alt="Shelly">
        <div class="btn-group">
            <button class="play-btn btn" onclick="startGame()">BATTLE</button>
            <button class="box-btn btn" onclick="openBox()">BOX (100 🪙)</button>
        </div>
    </div>

    <div id="move-joy" class="joy-zone" style="left: 60px;"><div class="handle"></div></div>
    <div id="aim-joy" class="joy-zone" style="right: 60px;"><div class="handle"></div></div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Tasvirlarni yuklash
    const shellyImg = new Image();
    shellyImg.src = 'https://vignette.wikia.nocookie.net/brawlstars/images/e/e0/Shelly_Portrait.png/revision/latest?cb=20181212104052';
    
    const bgImg = new Image();
    bgImg.src = 'https://i.pinimg.com/originals/14/8a/a6/148aa61730d0694119323f95f4ba4025.png'; // Grass Background

    let coins = localStorage.getItem('coins') ? parseInt(localStorage.getItem('coins')) : 0;
    let gems = localStorage.getItem('gems') ? parseInt(localStorage.getItem('gems')) : 0;
    let isRunning = false, frames = 0;

    function updateLobby() {
        document.getElementById('l-coins').innerText = coins;
        document.getElementById('l-gems').innerText = gems;
        localStorage.setItem('coins', coins);
        localStorage.setItem('gems', gems);
    }
    updateLobby();

    function openBox() {
        if (coins >= 100) {
            coins -= 100;
            let win = Math.floor(Math.random() * 10) + 5;
            gems += win;
            alert("BOX: 💎 " + win + " kristall!");
            updateLobby();
        } else alert("Tangalar kam!");
    }

    let player = { x: 0, y: 0, hp: 100, speed: 6 };
    let enemies = [], bullets = [], joys = { move: { x: 0, y: 0, active: false }, aim: { x: 0, y: 0, active: false } };

    function setupJoy(id, type) {
        const el = document.getElementById(id);
        const handle = el.querySelector('.handle');
        const rect = el.getBoundingClientRect();
        const cx = rect.left + 65, cy = rect.top + 65;

        const move = (e) => {
            e.preventDefault();
            const t = e.touches[0];
            let dx = t.clientX - cx, dy = t.clientY - cy;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 55);
            const ang = Math.atan2(dy, dx);
            joys[type].x = (Math.cos(ang) * dist) / 55;
            joys[type].y = (Math.sin(ang) * dist) / 55;
            handle.style.transform = `translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px))`;
            if (dist > 10) joys[type].active = true;
        };
        const stop = () => { joys[type].active = false; joys[type].x = 0; joys[type].y = 0; handle.style.transform = `translate(-50%, -50%)`; };
        el.addEventListener('touchstart', move); el.addEventListener('touchmove', move); el.addEventListener('touchend', stop);
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.querySelectorAll('.joy-zone').forEach(j => j.style.display = 'block');
        canvas.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        player.x = canvas.width/2; player.y = canvas.height/2;
        setupJoy('move-joy', 'move'); setupJoy('aim-joy', 'aim');
        isRunning = true; loop();
    }

    function loop() {
        if (!isRunning) return;
        frames++;
        
        // Background chizish
        if (bgImg.complete) {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#224422'; ctx.fillRect(0,0,canvas.width,canvas.height);
        }

        // Shelly (Player) chizish
        player.x += joys.move.x * player.speed;
        player.y += joys.move.y * player.speed;
        
        ctx.save();
        ctx.translate(player.x, player.y);
        // Otish yo'nalishiga qarab burish
        if (joys.aim.active) ctx.rotate(Math.atan2(joys.aim.y, joys.aim.x) + Math.PI/2);
        ctx.drawImage(shellyImg, -30, -40, 60, 80);
        ctx.restore();

        // Shooting logic (o'zgarmadi)
        if (joys.aim.active && frames % 10 === 0) {
            bullets.push({ x: player.x, y: player.y, vx: joys.aim.x*15, vy: joys.aim.y*15 });
        }

        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
            if(b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) bullets.splice(i,1);
        });

        // Enemies
        if (frames % 60 === 0) enemies.push({ x: Math.random()*canvas.width, y: -40, hp: 3 });
        enemies.forEach((e, i) => {
            let dx = player.x-e.x, dy = player.y-e.y, d = Math.sqrt(dx*dx+dy*dy);
            e.x += (dx/d)*2.5; e.y += (dy/d)*2.5;
            ctx.fillStyle = 'red'; ctx.beginPath(); ctx.roundRect(e.x-20, e.y-20, 40, 40, 5); ctx.fill();
            bullets.forEach((b, bi) => {
                if (Math.hypot(b.x-e.x, b.y-e.y) < 35) {
                    e.hp--; bullets.splice(bi,1);
                    if (e.hp <= 0) { enemies.splice(i,1); coins += 10; updateLobby(); }
                }
            });
            if (d < 45) player.hp -= 0.6;
        });

        // UI bars
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(player.x-25, player.y-55, 50, 8);
        ctx.fillStyle = '#00ff00'; ctx.fillRect(player.x-25, player.y-55, (player.hp/100)*50, 8);

        if (player.hp <= 0) { isRunning = false; alert("GAME OVER!"); location.reload(); }
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
