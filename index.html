<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Mini 2D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; background: #4caf50; /* Yashil maydon */ }
        #ui {
            position: absolute; top: 10px; left: 10px;
            color: white; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px #000; pointer-events: none;
        }
        .controls {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; justify-content: space-around;
            pointer-events: none;
        }
        .btn {
            width: 80px; height: 80px; background: rgba(255,255,255,0.3);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: white; font-weight: bold;
            pointer-events: auto; border: 4px solid #fff;
        }
    </style>
</head>
<body>

    <div id="ui">Brawlers Defeated: <span id="score">0</span></div>
    
    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div class="btn" id="moveBtn">JOYSTICK</div>
        <div class="btn" id="fireBtn" style="background: rgba(255,0,0,0.5);">FIRE</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let player = { x: canvas.width/2, y: canvas.height/2, size: 30, color: '#3b82f6', hp: 100 };
    let bullets = [];
    let enemies = [];
    let joystick = { active: false, x: 0, y: 0 };

    // Dushman yaratish
    function spawnEnemy() {
        enemies.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 25,
            hp: 2,
            color: '#ef4444'
        });
    }

    // O'q otish
    function fire() {
        bullets.push({ x: player.x, y: player.y, speedX: 0, speedY: -7 });
    }

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // O'yinchini chizish
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.stroke();

        // O'qlarni harakatlantirish
        bullets.forEach((b, index) => {
            b.y += b.speedY;
            ctx.fillStyle = "yellow";
            ctx.fillRect(b.x - 5, b.y - 5, 10, 10);
            if (b.y < 0) bullets.splice(index, 1);
        });

        // Dushmanlarni harakatlantirish
        enemies.forEach((en, eIdx) => {
            // Dushman o'yinchiga qarab yuradi
            let dx = player.x - en.x;
            let dy = player.y - en.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            en.x += (dx/dist) * 1.5;
            en.y += (dy/dist) * 1.5;

            ctx.fillStyle = en.color;
            ctx.beginPath();
            ctx.arc(en.x, en.y, en.size, 0, Math.PI * 2);
            ctx.fill();

            // O'q tegishini tekshirish
            bullets.forEach((b, bIdx) => {
                let d = Math.sqrt((en.x - b.x)**2 + (en.y - b.y)**2);
                if (d < en.size) {
                    en.hp--;
                    bullets.splice(bIdx, 1);
                    if (en.hp <= 0) {
                        enemies.splice(eIdx, 1);
                        score++;
                        scoreElement.innerText = score;
                    }
                }
            });
        });

        requestAnimationFrame(update);
    }

    // Bosish hodisalari
    canvas.addEventListener('touchstart', (e) => {
        let touch = e.touches[0];
        if (touch.clientX > canvas.width / 2) {
            fire(); // O'ng taraf otish
        }
    });

    // Harakat (Sichqoncha yoki sensor)
    window.addEventListener('pointermove', (e) => {
        player.x = e.clientX;
        player.y = e.clientY;
    });

    setInterval(spawnEnemy, 2000);
    update();
</script>
</body>
</html>
